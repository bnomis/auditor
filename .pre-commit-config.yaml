repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.2
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  -   repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1-1
      hooks:
      - id: shellcheck
        args: ["--external-sources", "--source-path=SCRIPTDIR"]

  # The audit hooks, run from this repository's own tree rather than pinned to
  # a revision of it: this is the checker's repository, so a checker change
  # applies in the commit that makes it. Other projects pin them; see
  # claude/skills/auditme-project-setup/SKILL.md.
  - repo: local
    hooks:
      - id: auditme-changed
        name: no unaccepted audit hits in changed files
        entry: claude/skills/auditme/checks/changed.py
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: auditme-all
        name: no unaccepted audit hits anywhere
        entry: claude/skills/auditme/checks/changed.py --all
        language: script
        pass_filenames: false
        always_run: true
        # Manual only until the backlog item in TODO.md ("Fix or accept this
        # repository's audit backlog") is done; then pre-push returns.
        stages: [manual]

      # This repository serves many projects, so no file or commit message
      # names one (the agents repository's claude/rules/rule-scope.md). The
      # names are listed outside the repository; see
      # bin/check-foreign-names.sh.
      - id: no-project-names
        name: no project names in a repository used across projects
        entry: bin/check-foreign-names.sh
        language: script
        exclude: ^uv\.lock$
        stages: [pre-commit, commit-msg]
