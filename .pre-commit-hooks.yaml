- id: auditme-changed
  name: no unaccepted audit hits in changed files
  entry: auditor changed
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: auditme-all
  name: no unaccepted audit hits anywhere
  entry: auditor changed --all
  language: python
  pass_filenames: false
  always_run: true
  stages: [manual]
- id: no-project-names
  name: no project names in a repository used across projects
  entry: bin/check-foreign-names.sh
  language: script
  exclude: ^uv\.lock$
  stages: [pre-commit, commit-msg]
