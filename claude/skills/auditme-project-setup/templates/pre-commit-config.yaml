repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["--external-sources", "--source-path=SCRIPTDIR"]

  # The shared audit hooks, pinned to one commit of the checker.
  # Upgrade with: pre-commit autoupdate --repo git@github.com:bnomis/auditor.git
  - repo: git@github.com:bnomis/auditor.git
    rev: {{AUDITOR_REV}}
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
